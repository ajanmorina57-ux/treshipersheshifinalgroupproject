<!DOCTYPE html>
<html lang="en" class="html-root">

<head class="head-section">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="page-title">Log in - The Trading Pro</title>
</head>

<body class="page-body">

    <header class="site-header">
        <h1 class="site-title">The Trading Pro</h1>

        <nav class="site-nav">
            <a href="index.html" class="nav-link">Home</a> |
            <a href="courses.html" class="nav-link">Courses</a> |
            <a href="about.html" class="nav-link">About</a> |
            <a href="contact.html" class="nav-link">Contact</a> |
        </nav>
    </header>


    <hr class="section-divider">

    <main class="site-main">

        <section class="login-section">
            <h2 class="section-title">Log in</h2>

            <form action="#" method="post" class="login-form">

                <p class="form-group">
                    <label for="email" class="form-label">Email:</label><br class="form-break">
                    <input type="email" id="email" name="email" required class="form-input">
                </p>

                <p class="form-group">
                    <label for="password" class="form-label">Password:</label><br class="form-break">
                    <input type="password" id="password" name="password" required class="form-input">
                </p>

                <p class="form-group form-submit-group">
                    <input type="submit" value="Log in" class="form-submit">
                </p>

            </form>
        </section>

        <hr class="section-divider">

        <section class="register-section">
            <h2 class="section-title">Create Account</h2>

            <form action="#" method="post" class="register-form">

                <p class="form-group">
                    <label for="name" class="form-label">Full Name:</label><br class="form-break">
                    <input type="text" id="name" name="name" required class="form-input">
                </p>

                <p class="form-group">
                    <label for="newemail" class="form-label">Email:</label><br class="form-break">
                    <input type="email" id="newemail" name="email" required class="form-input">
                </p>

                <p class="form-group">
                    <label for="newpassword" class="form-label">Password:</label><br class="form-break">
                    <input type="password" id="newpassword" name="password" required class="form-input">
                </p>

                <p class="form-group form-submit-group">
                    <input type="submit" value="Create Account" class="form-submit">
                </p>

            </form>
        </section>

    </main>

    <hr class="section-divider">

    <footer class="site-footer">

        <p class="footer-text copyright-text">
            &copy; 2026 The Trading Pro.
        </p>

        <p class="footer-text disclaimer-text">
            For education only - not investment advice.
        </p>

        <p class="footer-text footer-nav-p">
            <a href="courses.html" class="footer-link">Courses</a> |
            <a href="about.html" class="footer-link">About</a> |
            <a href="contact.html" class="footer-link">Contact</a>
        </p>

    </footer>

</body>
</html>
