<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - The Trading Pro</title>
</head>


<body class="page-body">

    <div>
        <div class="payment">
            <h2>Payment</h2>
            <p>Enter your payment details to complete the purchase.</p>
        </div>

        <form class="form" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="address">Address:</label>
            <input type="text" name="address" id="address" required>

            <label for="pay">Payment Method:</label>
            <select name="pay" id="pay">
                <option value="cash">Cash</option>
                <option value="visa">Visa</option>
                <option value="paypal">PayPal</option>
            </select>

            <label for="cardnumber">Card Number:</label>
            <input type="text" id="cardnumber" name="cardnumber" placeholder="XXXX XXXX XXXX XXXX" required>

            <label for="expiry">Expiry Date:</label>
            <input type="text" name="expiry" id="expiry" placeholder="MM/YY" required>

            <label for="cvv">CVV:</label>
            <input type="text" name="cvv" id="cvv" maxlength="4" required>

            <hr class="section-divider">

    <footer class="site-footer">
        <p class="footer-text copyright-text">
            &copy; 2026 The Trading Pro.
        </p>

        <p class="footer-text disclaimer-text">
            For education only - not investment advice.
        </p>

        <p class="footer-text footer-nav-p">
            <a href="courses.html" class="footer-link">Courses</a> |
            <a href="about.html" class="footer-link">About</a> |
            <a href="contact.html" class="footer-link">Contact</a> |
        </p>
    </footer>

    <script src="script.js" class="script-section"></script>
    <script src="jquery-4.0.0.min.js"></script>



            


    
</body>
</html>
